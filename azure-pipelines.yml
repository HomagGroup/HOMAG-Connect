#     type: git
#     name: OneHomag/SWC-DevOps-HoT
#     ref: main

trigger:
  branches:
    include:
    - main
    - 'dependabot/nuget/*'
  tags:
    include:
    - '*'

pr:
  branches:
    include:
      - '*'

schedules:
  - cron: '0 3 * * 0'
    displayName: Weekly translation refresh (Sunday)
    branches:
      include:
        - main
    always: true

variables:
  dotnetVersion: 10.0.x
  testPublishTargetFramework: net10.0
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
  ProductName: HomagGroup.DigitalFactory.DigitalDevelopment
  ProjectName: HomagConnect 
  TranslationRefreshScheduleDisplayName: Weekly translation refresh (Sunday)
  TranslationRefreshPullRequestLabel: refresh-translations

  
stages:
  - stage: retrieve_version_info_from_git
    displayName: Get Version info
    jobs:
    - template: pipelines/templates/retrieve-version-info-jobs.yml

  # MEND
  # - template: software-composition-analysis/template.yml@templates
  #   parameters:
  #     dependsOn: 
  #     - retrieve_version_info_from_git
  #     fully_qualifed_package_name: HomagGroup.DigitalFactory.Solutions.DF-Insights
  #     analyze_directory: $(Build.SourcesDirectory)
  #     package_version: $[ stageDependencies.retrieve_version_info_from_git.get_number_job.outputs['version_task.VERSION_TAG'] ]

  - stage: Build
    dependsOn: retrieve_version_info_from_git
    pool:
      #vmimage: 'windows-latest'
      name: Homag Windows Agents
    variables:
      - name: BuildConfiguration
        value: Release
      - name: VERSION_TAG
        value: $[ stageDependencies.retrieve_version_info_from_git.get_number_job.outputs['version_task.VERSION_TAG'] ]
      - group: dftranslationvariables
  
    # MEND
    # dependsOn: software_composition_analysis_stage
    jobs:
    - template: pipelines/templates/build-stage-jobs.yml

    # The CopilotCodeReview@1 task only supports Azure Repos pull requests: it passes
    # System.PullRequest.PullRequestId to an Int32 parameter and queries the Azure DevOps PR API.
    # This repository is hosted on GitHub, so Copilot is requested as a reviewer via the
    # GitHub REST API using the internal PAT from the 'dfCopilot' variable group instead.
    # Build.Repository.Provider is not available during condition evaluation (resolves to Null),
    # so the GitHub pull request number is used to detect a GitHub PR build instead.
    - job: CoPilotCodeReview
      displayName: 'Copilot Code Review'
      condition: and(eq(variables['Build.Reason'], 'PullRequest'), ne(variables['System.PullRequest.PullRequestNumber'], ''))
      continueOnError: true
      pool:
        vmImage: 'ubuntu-latest'
      variables:
        - group: dfCopilot
      steps:
        - checkout: none
        - task: PowerShell@2
          displayName: 'Request Copilot review on GitHub pull request'
          continueOnError: true
          inputs:
            targetType: inline
            pwsh: true
            script: |
              $repository = '$(Build.Repository.Name)'
              $pullRequestNumber = '$(System.PullRequest.PullRequestNumber)'

              if ([string]::IsNullOrWhiteSpace($pullRequestNumber)) {
                  Write-Host '##vso[task.logissue type=warning]No GitHub pull request number available, skipping Copilot review request.'
                  return
              }

              $headers = @{
                  Authorization          = "Bearer $env:GITHUB_PAT"
                  Accept                 = 'application/vnd.github+json'
                  'X-GitHub-Api-Version' = '2022-11-28'
                  'User-Agent'           = 'HomagConnect-AzurePipelines'
              }

              $uri = "https://api.github.com/repos/$repository/pulls/$pullRequestNumber/requested_reviewers"
              $body = @{ reviewers = @('copilot-pull-request-reviewer[bot]') } | ConvertTo-Json

              Write-Host "Requesting Copilot review for $repository#$pullRequestNumber"

              try {
                  Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
                  Write-Host 'Copilot review requested successfully.'
              }
              catch {
                  $statusCode = $_.Exception.Response.StatusCode.value__
                  $message = $_.ErrorDetails.Message
                  Write-Host "##vso[task.logissue type=warning]Failed to request Copilot review (HTTP $statusCode): $message"
              }
          env:
            GITHUB_PAT: $(GITHUB-PAT)

